[package]
name = "lwdbg-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
serde_json.workspace = true
time.workspace = true
rusqlite.workspace = true
lwdbg-ssot.workspace = true

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-roots", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
dashmap = "6"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tracing = "0.1"
